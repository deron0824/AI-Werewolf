# 狼人杀 Demo：server + client（nginx 反代 /api 与 /socket.io）双容器一键启动
# 用法：docker compose up --build -d
# 访问：http://localhost（或局域网 IP）—— 两台设备走同一地址即可开局
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: werewolf-server
    restart: unless-stopped
    environment:
      PORT: 3000
      # 极速模式：SPEED_MODE=0.5 时全部延迟减半；0 = 最小延迟
      SPEED_MODE: "1"
      # LLM 单次调用超时（ms），默认 10000
      LLM_TIMEOUT_MS: "10000"
      # 真人行动超时（0 = 法官无限等待真人，Demo 默认）
      HUMAN_ACTION_TIMEOUT_MS: "0"
    volumes:
      # WorkBuddy 云激活产物（endpoint + publishableKey），缺失则自动降级到路线 B/C
      - ./cloudConfig.json:/app/cloudConfig.json:ro
      # 路线 B settings.json（0600）与复盘数据持久化
      - server-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: werewolf-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  server-data:
